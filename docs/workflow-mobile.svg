<svg xmlns="http://www.w3.org/2000/svg" width="390" height="745" viewBox="0 0 390 745" role="img" aria-labelledby="title desc" lang="zh-CN">
  <title id="title">语音情绪评测集工作流程</title>
  <desc id="desc">按手头材料进入采录设计、听审定稿或评分交付。每段依次显示输入、处理和交付物。</desc>
  <style>
    text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; fill: #193c30; }
    .stage { font-size: 14px; font-weight: 600; fill: #267453; }
    .material, .result { font-size: 18px; font-weight: 600; }
    .action { font-size: 16px; }
    .file { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 13px; fill: #35594a; }
    .handoff { font-size: 14px; fill: #456555; }
    .card { fill: #f7faf8; stroke: #cbdcd2; }
    .output { fill: #e1f1e6; }
    .arrow { fill: none; stroke: #648875; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
    <g id="handoff-arrow" class="arrow"><path d="M0 0v18m-5-6 5 6 5-6"/></g>
    <g id="steps" class="arrow"><path d="M0 0v61m-4-5 4 5 4-5"/></g>
  </defs>
  <rect width="390" height="745" rx="10" fill="#fff"/>
  <g transform="translate(8 7)" aria-label="采录设计">
    <rect class="card" width="374" height="223" rx="12"/>
    <text class="stage" x="18" y="25">采录设计</text>
    <text class="material" x="18" y="53">一句业务需求</text>
    <use href="#steps" x="24" y="72"/>
    <text class="action" x="41" y="83">确定场景、标签和配额</text>
    <text class="action" x="41" y="107">编写录制文本和表演提示</text>
    <text class="action" x="41" y="131">核验数量与同人同句配对</text>
    <rect class="output" x="12" y="148" width="350" height="63" rx="7"/>
    <text class="result" x="25" y="175">待录清单与配额配置</text>
    <text class="file" x="25" y="196">collection.csv · config.json</text>
  </g>
  <use href="#handoff-arrow" x="32" y="234"/>
  <text class="handoff" x="49" y="249">录制人按清单录音</text>
  <g transform="translate(8 260)" aria-label="听审定稿">
    <rect class="card" width="374" height="223" rx="12"/>
    <text class="stage" x="18" y="25">听审定稿</text>
    <text class="material" x="18" y="53">WAV 与编号清单</text>
    <use href="#steps" x="24" y="72"/>
    <text class="action" x="41" y="83">两人独立听审，检查音质</text>
    <text class="action" x="41" y="107">音质合格且判断一致可定稿</text>
    <text class="action" x="41" y="131">有分歧则复核</text>
    <rect class="output" x="12" y="148" width="350" height="63" rx="7"/>
    <text class="result" x="25" y="175">人工金标与听审记录</text>
    <text class="file" x="25" y="196">final.csv · audit.csv</text>
  </g>
  <use href="#handoff-arrow" x="32" y="487"/>
  <text class="handoff" x="49" y="502">人工定稿后</text>
  <g transform="translate(8 513)" aria-label="评分交付">
    <rect class="card" width="374" height="223" rx="12"/>
    <text class="stage" x="18" y="25">评分交付</text>
    <text class="material" x="18" y="53">人工定稿、WAV 及接收端要求</text>
    <path class="arrow" d="M24 75v52m-4-5 4 5 4-5"/>
    <text class="action" x="41" y="91">按编号匹配录音与金标</text>
    <text class="action" x="41" y="119">映射字段，导出后回读核验</text>
    <rect class="output" x="12" y="148" width="350" height="63" rx="7"/>
    <text class="result" x="25" y="175">评分清单与配套录音</text>
    <text class="file" x="25" y="196">manifest.jsonl · WAV</text>
  </g>
</svg>
